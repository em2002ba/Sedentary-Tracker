# CI/CD pipeline for the Sedentary Activity Tracker
# Stages: 1 Lint -> 2 Build & Test -> 3 Security scan -> 4 Package (Docker) -> 5 Deploy (GHCR, staging)
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Used by sqlx compile-time query checks and the DB integration tests
  DATABASE_URL: postgres://postgres:password@localhost:5432/sedentary_tracker

jobs:
  # ---------- Stage 1: code quality ----------
  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sedentary_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config postgresql-client
      - name: Apply database migrations
        run: psql "$DATABASE_URL" -f migrations/20260101165438_create_observations.sql
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # ---------- Stage 2: build and test ----------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sedentary_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config postgresql-client
      - name: Apply database migrations
        run: psql "$DATABASE_URL" -f migrations/20260101165438_create_observations.sql
      - name: Build (release)
        run: cargo build --workspace --release
      - name: Run unit and integration tests
        run: cargo test --workspace --release
      - name: Smoke test the server
        run: |
          ./target/release/server > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
          curl -fs http://localhost:8000/health | grep -q Healthy
          curl -fs -o /dev/null http://localhost:8000/
          echo "Server is healthy"
      - name: Show server log
        if: always()
        run: cat server.log || true
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: target/release/server
          retention-days: 7

  # ---------- Stage 3: security scan ----------
  security-scan:
    name: Dependency security scan (cargo audit)
    runs-on: ubuntu-latest
    needs: lint
    # Report-only for now: the scan currently finds known advisories in
    # old dependencies (sqlx 0.7, rustls, ...). Upgrading them is a backlog item.
    # Remove continue-on-error once they are fixed to make the scan a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: |
          cargo audit --json > audit-report.json || AUDIT_FAILED=1
          cargo audit || true
          exit ${AUDIT_FAILED:-0}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json

  # ---------- Stage 4: package ----------
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: dist
      - name: Make binary executable
        run: chmod +x dist/server
      - name: Build image
        run: docker build --build-arg SRC_DIR=${{ github.workspace }} -t sedentary-tracker:${{ github.sha }} .
      - name: Scan image with Trivy (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sedentary-tracker:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Save image
        run: docker save sedentary-tracker:${{ github.sha }} | gzip > image.tar.gz
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 3

  # ---------- Stage 5: deploy (continuous delivery to GitHub Container Registry) ----------
  deploy:
    name: Deploy to staging (GHCR)
    runs-on: ubuntu-latest
    needs: docker
    # Only deploy from main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load image
        run: gunzip -c image.tar.gz | docker load
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag sedentary-tracker:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag sedentary-tracker:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "Deployed $IMAGE:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
